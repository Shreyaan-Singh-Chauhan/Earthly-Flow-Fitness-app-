<!DOCTYPE html>
<html>
<head>
  <title>Shreyaan Chat App 🔥</title>


<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a1a, #2b1d14);
    color: #f5f5f5;
    display: flex;
    height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: #051819;
    padding: 20px;
    border-right: 2px solid #DB9F75;
    border-radius: 15px;
    
  }

  .sidebar h3 {
    margin-top: 0;
    color: #DB9F75;
    text-shadow: 0 0 10px #DB9F75;
  }

  #users li {
    
    list-style: none;
    padding: 10px;
    margin: 8px 0;
    background: #2e1f16;
    border-radius: 10px;
    border: 1px solid #DB9F75;
    box-shadow: 0 0 10px #DB9F75;
  }

  /* Chat Area */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: #122324;
  }

  .chat-header {
    padding: 18px;
    background: #081414;
    border-bottom: 2px solid #DB9F75;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #DB9F75;
    text-shadow: 0 0 10px #DB9F75;
  }

  #chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }

  #chat p {
    background: #804012;
    padding: 12px 18px;
    border-radius: 15px;
    margin: 10px 0;
    width: fit-content;
    max-width: 60%;
    border: 1px solid #DB9F75;
    box-shadow: 0 0 12px #DB9F75;
  }

  /* Scrollbar neon */
  #chat::-webkit-scrollbar {
    width: 8px;
  }

  #chat::-webkit-scrollbar-thumb {
    background: #DB9F75;
    border-radius: 10px;
  }

  /* Input area */
  .input-area {
    display: flex;
    padding: 15px;
    background: #122324;
    border-top: 2px solid #DB9F75;
    border-radius: 15px;
  }

  #messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 25px;
    border: 1px solid #DB9F75;
    outline: none;
    background: #122324;
    color: #fff;
    box-shadow: 0 0 10px #DB9F75;
  }

  #messageInput::placeholder {
    color: #aaa;
  }

  button {
    margin-left: 12px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: #DB9F75;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 15px #DB9F75;
    transition: 0.3s;
  }

  button:hover {
    background: #DB9F75;
    box-shadow: 0 0 25px #DB9F75;
  }

  #typingIndicator {
    padding-left: 20px;
    color: #DB9F75;
    font-style: italic;
    text-shadow: 0 0 8px #DB9F75;
  }
</style>
</head>

<body>
  
  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Online Users</h3>
    <ul id="users"></ul>
  </div>

  <!-- Chat Section -->
  <div class="chat-container">
    <div class="chat-header">
      Hackathon Group 🚀
    </div>

    <div id="chat"></div>

    <p id="typingIndicator"></p>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Keep your SAME JS below this -->
  <script src="http://10.41.170.25:8000/socket.io/socket.io.js"></script>
  
    <script>
  const socket = io("http://10.41.170.25:8000");

  let username = localStorage.getItem("username");

  if (!username) {
    username = prompt("Enter your name:");
    localStorage.setItem("username", username);
  }

  const group = "hackathon";
  const chatDiv = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const typingDiv = document.getElementById("typingIndicator");

  // Join only after connection
  socket.on("connect", () => {
    socket.emit("joinGroup", { username, group });
  });

  // Online users
  socket.on("onlineUsers", (users) => {
    const usersList = document.getElementById("users");
    usersList.innerHTML = "";

    users.forEach(user => {
      const li = document.createElement("li");
      li.textContent = user;
      usersList.appendChild(li);
    });
  });

  // Load previous messages
  socket.on("previousMessages", (messages) => {
    chatDiv.innerHTML = "";
    messages.forEach(msg => {
      const p = document.createElement("p");
      p.textContent = `${msg.username}: ${msg.text}`;
      chatDiv.appendChild(p);
    });
  });

  // New message
  socket.on("message", (msg) => {
    const p = document.createElement("p");
    p.textContent = `${msg.username}: ${msg.text}`;
    chatDiv.appendChild(p);
  });

  // Send message
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    socket.emit("sendMessage", {
      username,
      group,
      text
    });

    input.value = "";
    socket.emit("stopTyping", { group });
  }

  // Typing detect
  let typingTimeout;

  input.addEventListener("input", () => {
    socket.emit("typing", { username, group });

    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {
      socket.emit("stopTyping", { group });
    }, 1000);
  });
  input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();   // page refresh ya weird behaviour avoid
    sendMessage();
    }
  });

  // Show typing
  socket.on("typing", (user) => {
    if (user !== username) {
      typingDiv.textContent = `${user} is typing...`;
    }
  });

  // Stop typing
  socket.on("stopTyping", () => {
    typingDiv.textContent = "";
  });

</script>
  

</body>
</html>
